# /etc/nginx/sites-available/activeiolabs.conf — static export served from /var/www/activeiolabs.
# HTTP only as written; `certbot --nginx -d activeiolabs.com -d www.activeiolabs.com` adds HTTPS + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name activeiolabs.com www.activeiolabs.com;

    root /var/www/activeiolabs;
    index index.html;

    # Canonical host is the apex (same as the old .htaccess).
    if ($host = www.activeiolabs.com) {
        return 301 https://activeiolabs.com$request_uri;
    }

    # trailingSlash: true exports every route as <route>/index.html.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
